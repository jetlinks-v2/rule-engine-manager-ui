name: Auto Deploy jetlinks-ui to the JetLinks Maven Repository

on:
  push:
    branches: ["2.11"]


jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [ 22.x ]
        #        os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
      - run: echo ${{github.ref}}
      - name: Set up Repository info
        uses: actions/setup-java@v4
        with:
          overwrite-settings: false
          java-version: '8'
          distribution: 'temurin'
      - name: Configure Maven settings
        #uses: actions/cache@v3
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "<settings>
                  <servers>
                    <server>
                      <id>snapshots</id>
                      <username>${MAVEN_USERNAME}</username>
                      <password>${MAVEN_PASSWORD}</password>
                    </server>
                  </servers>
                </settings>" > "$RUNNER_TEMP/maven-settings.xml"
          
          # Step 4: 构建并发布到 Maven 私有仓库
      - name: Build and Deploy to Maven
        run: mvn --settings "$RUNNER_TEMP/maven-settings.xml" clean deploy -Pui-package
